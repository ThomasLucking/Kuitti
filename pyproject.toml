[project]
name = "scry"
version = "0.1.0"
description = "Receipt scanner: Tesseract OCR on phone scans to track spending"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.161.1",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
